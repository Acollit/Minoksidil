    - generic [ref=e264]:
      - generic [ref=e267]:
        - heading "Фигуры из пенопласта" [level=2] [ref=e268] [cursor=pointer]
        - paragraph [ref=e271]:
          - text: — современное и недорогое решение для оформления любых пространств. Они станут прекрасным дополнением вашего дома, офиса или дачного участка. Купить уже готовые объемные фигуры из пенопласта или заказать индивидуальное изготовление пенопластовых 3D-фигур Вы сможете в компании «ТОП-Пенопласт».Воспользуйтесь формой
          - link "«ЗАКАЗАТЬ РАСЧЕТ»" [ref=e272] [cursor=pointer]:
            - /url: https://www.toppenoplast.ru/zakazat-raschet?roistat_visit=245479
          - text: ", указав необходимые размеры и дополнительные параметры объемной фигуры из пенопласта, или"
          - link "ЗАКАЖИТЕ ЗВОНОК" [ref=e273] [cursor=pointer]:
            - /url: https://www.toppenoplast.ru/?roistat_visit=245479#
          - text: и наш менеджер свяжется с Вами в течение нескольких минут для уточнения всех необходимых деталей.
      - generic [ref=e276]:
        - heading "Пенопластовые объемные фигуры – великолепная и оригинальная возможность прорекламировать свой бизнес." [level=3] [ref=e277] [cursor=pointer]
        - generic [ref=e279]:
          - generic [ref=e280]: Представители любого бизнеса задаются вопросом, как сделать рекламируемый продукт ближе к покупателю и оживить процесс знакомства с ним потенциальных клиентов. На этот счет у нашей компании имеется интересное предложение – 3Д фигуры из пенопласта, изготовлением которых мы занимаемся на заказ по низким ценам.
          - generic [ref=e281]: Нечто подобное в рекламном мире уже практикуется. Аналогами являются к примеру яркие тематические вывески, ростовые куклы, надувные копии предметов. Тем не менее, каждый из приведенных вариантов имеет свои недочеты, при этом наши пенопластовые изделия практически лишена недостатков, и мы объясним Вам, почему.
      - generic [ref=e284]:
        - heading "Неоспоримые преимущества 3d фигур из пенопласта" [level=3] [ref=e285] [cursor=pointer]
        - generic [ref=e287]:
          - strong [ref=e289]: "Объемные 3Д фигуры из пенопласта по праву можно назвать настоящей революцией в мире современного декора. Они обладают массой положительных характеристик:"
          - list [ref=e291]:
            - listitem [ref=e292]:
              - emphasis [ref=e293]:
                - strong [ref=e294]: Малый вес
              - text: . За счет данного свойства пенопластовые фигуры легко транспортируются, купив их, не требуется привлечение спецтехники и большого количества рабочих. Доставка даже самых крупногабаритных моделей выполняется максимально быстро и удобно. Не менее комфортен и монтаж изделий, установка которых может производиться в любом месте. Для этого нет необходимости обладать строительными навыками, а сборка объемных фигур из пенопласта, состоящих из нескольких частей, выполняется с помощью специальных составов;
          - list [ref=e296]:
            - listitem [ref=e297]:
              - emphasis [ref=e298]:
                - strong [ref=e299]: Устойчивость к внешним воздействиям
              - text: . Принято считать, что пенопласт относится к материалам, обладающим низкой прочностью. Мы готовы успокоить даже самых убежденных скептиков. Для изготовления объемных фигур из пенопласта нами используются специальные сорта пенополистирола, материала повышенной прочности. Дополнительную защиту от механических и климатических воздействий им обеспечивают специальные покрытия. Кроме того, для придания крупногабаритным пенопластовым фигурам особой устойчивости мы можем оснастить их металлическим каркасом;
          - list [ref=e301]:
            - listitem [ref=e302]:
              - emphasis [ref=e303]:
                - strong [ref=e304]: Широкие возможности для оформления
