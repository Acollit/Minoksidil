    - generic [ref=e266]:
      - generic [ref=e269]:
        - heading [level=2]
        - emphasis [ref=e271]:
          - strong [ref=e272]: Фигуры из пенопласта — современное и недорогое решение для оформления любых пространств. Они станут прекрасным дополнением вашего дома, офиса или дачного участка.
        - generic [ref=e273]: Купить уже готовые объемные фигуры из пенопласта или заказать индивидуальное изготовление пенопластовых 3D-фигур Вы сможете в компании «ТОП-Пенопласт».
      - generic [ref=e276]:
        - heading [level=3]
        - generic [ref=e277]:
          - text: Воспользуйтесь формой
          - link [ref=e278] [cursor=pointer]:
            - /url: https://dev1.toppenoplast.ru/zakazat-raschet
            - strong [ref=e279]: «ЗАКАЗАТЬ РАСЧЕТ»
          - text: ", указав необходимые размеры и дополнительные параметры объемной фигуры из пенопласта, или"
          - strong [ref=e280]:
            - link "ЗАКАЖИТЕ ЗВОНОК" [ref=e281] [cursor=pointer]:
              - /url: https://dev1.toppenoplast.ru/#
          - text: и наш менеджер свяжется с Вами в течение нескольких минут для уточнения всех необходимых деталей.
        - strong [ref=e284]: Пенопластовые объемные фигуры – великолепная и оригинальная возможность прорекламировать свой бизнес.
        - generic [ref=e285]: Представители любого бизнеса задаются вопросом, как сделать рекламируемый продукт ближе к покупателю и оживить процесс знакомства с ним потенциальных клиентов. На этот счет у нашей компании имеется интересное предложение – 3Д фигуры из пенопласта, изготовлением которых мы занимаемся на заказ по низким ценам.
        - generic [ref=e286]: Нечто подобное в рекламном мире уже практикуется. Аналогами являются к примеру яркие тематические вывески, ростовые куклы, надувные копии предметов. Тем не менее, каждый из приведенных вариантов имеет свои недочеты, при этом наши пенопластовые изделия практически лишена недостатков, и мы объясним Вам, почему.
      - generic [ref=e289]:
        - heading "Неоспоримые преимущества 3d фигур из пенопласта" [level=3] [ref=e290]
        - strong [ref=e292]: "Объемные 3Д фигуры из пенопласта по праву можно назвать настоящей революцией в мире современного декора. Они обладают массой положительных характеристик:"
        - list [ref=e294]:
          - listitem [ref=e295]:
            - emphasis [ref=e296]:
              - strong [ref=e297]: Малый вес
            - text: . За счет данного свойства пенопластовые фигуры легко транспортируются, купив их, не требуется привлечение спецтехники и большого количества рабочих. Доставка даже самых крупногабаритных моделей выполняется максимально быстро и удобно. Не менее комфортен и монтаж изделий, установка которых может производиться в любом месте. Для этого нет необходимости обладать строительными навыками, а сборка объемных фигур из пенопласта, состоящих из нескольких частей, выполняется с помощью специальных составов;
        - list [ref=e299]:
          - listitem [ref=e300]:
            - emphasis [ref=e301]:
              - strong [ref=e302]: Устойчивость к внешним воздействиям
            - text: . Принято считать, что пенопласт относится к материалам, обладающим низкой прочностью. Мы готовы успокоить даже самых убежденных скептиков. Для изготовления объемных фигур из пенопласта нами используются специальные сорта пенополистирола, материала повышенной прочности. Дополнительную защиту от механических и климатических воздействий им обеспечивают специальные покрытия. Кроме того, для придания крупногабаритным пенопластовым фигурам особой устойчивости мы можем оснастить их металлическим каркасом;
        - list [ref=e304]:
          - listitem [ref=e305]:
            - emphasis [ref=e306]:
              - strong [ref=e307]: Широкие возможности для оформления
            - text: . При декорировании помещений или открытых пространств пенопластовыми фигурами особое внимание уделяется выбору материала, внешний вид которого должен в точности соответствовать имеющемуся дизайнерскому решению. Подобные изделия легко имитируют структуру металла, дерева или ткани. А, благодаря специальным методам отделки, при изготовлении мы сможем придать вашим 3D фигурам из пенопласта схожесть с каменными изваяниями или роскошными гипсовыми скульптурами.
        - generic [ref=e308]: Кроме того, вся продукция из пенопласта абсолютно экологична, а стоимость фигур намного ниже, чем у аналогичных изделий из других материалов.
